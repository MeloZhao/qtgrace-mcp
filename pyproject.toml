[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qtgrace-mcp"
version = "0.2.0"
description = "MCP server for qtgrace (Grace/xmgrace Qt port) scientific plotting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "qtgrace-mcp contributors" },
]
keywords = ["mcp", "qtgrace", "grace", "xmgrace", "plotting", "scientific", "gromacs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "mcp>=1.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
fast = ["numpy>=1.24"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
qtgrace-mcp = "qtgrace_mcp.server:main"

[project.urls]
Homepage = "https://github.com/your-org/qtgrace-mcp"
Issues = "https://github.com/your-org/qtgrace-mcp/issues"

[tool.setuptools]
packages = ["qtgrace_mcp"]

[tool.setuptools.package-data]
qtgrace_mcp = ["examples/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
