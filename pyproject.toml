[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qtgrace-mcp"
version = "0.4.0"
description = "MCP server for qtgrace (Grace/xmgrace Qt port) — TCP control of the live GUI, plus a dependency-free batch plotting engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "qtgrace-mcp contributors" },
]
keywords = ["mcp", "qtgrace", "grace", "xmgrace", "plotting", "scientific", "gromacs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Only the TCP half needs these; the batch engine (batch.py, agr.py, catalog.py,
# printer.py) and the CLI are dependency-free.
dependencies = [
    "mcp>=1.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
fast = ["numpy>=1.24"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
qtgrace-mcp = "qtgrace_mcp.server:main"
qtgrace-plot = "qtgrace_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/MeloZhao/qtgrace-mcp"
Issues = "https://github.com/MeloZhao/qtgrace-mcp/issues"

[tool.setuptools]
packages = ["qtgrace_mcp"]

[tool.setuptools.package-data]
qtgrace_mcp = ["examples/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
