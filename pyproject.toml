[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qtgrace-mcp"
version = "0.1.0"
description = "MCP server for qtgrace (Grace/xmgrace Qt port) scientific plotting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "pillow>=9.0",
]

[project.scripts]
qtgrace-mcp = "qtgrace_mcp.server:main"

[tool.setuptools]
packages = ["qtgrace_mcp"]
